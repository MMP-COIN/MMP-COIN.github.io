name: Keep MMP COIN AI in maintenance mode

on:
  push:
    branches: ["main"]
    paths:
      - ".maintenance/site/**"
      - ".github/workflows/maintenance-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: root-pages-maintenance
  cancel-in-progress: true

jobs:
  publish-maintenance:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout maintenance source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true

      - name: Build maintenance-only artifact
        run: |
          set -euo pipefail
          test -s .maintenance/site/index.html
          grep -q 'سامانه موقتاً در دسترس نیست' .maintenance/site/index.html
          grep -q 'تا زمانی که صحت داده‌های زنده' .maintenance/site/index.html
          mkdir -p _site
          cp .maintenance/site/index.html _site/index.html
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 2

      - name: Upload maintenance artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

      - name: Deploy maintenance page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Verify maintenance page is the only published entry
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 4 --max-time 25 "$SITE_URL/?mmp_maintenance_verify=$GITHUB_RUN_ID" -o /tmp/mmp-maintenance.html
          grep -q 'سامانه موقتاً در دسترس نیست' /tmp/mmp-maintenance.html
          grep -q 'در حال آماده‌سازی و کنترل کیفیت' /tmp/mmp-maintenance.html
          ! grep -q 'mmp-web-build' /tmp/mmp-maintenance.html
          ! grep -q 'app.js' /tmp/mmp-maintenance.html
          echo "PASS: root Pages serves the maintenance-only page, not the legacy application."

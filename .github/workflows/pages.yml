                }
                if (await page.locator('script[src*="mmp-chart-pro-upgrade.js"]').count() !== 1) throw new Error(viewport.name + " advanced live chart upgrade script is missing");
                const commandMenu = page.locator("#mmp-center-toolbar .mmp-center-jump");
                if (await commandMenu.count() !== 6) throw new Error(viewport.name + " Market Command card must expose six internal navigation links");

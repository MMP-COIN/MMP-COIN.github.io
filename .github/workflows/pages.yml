      - name: Deploy root site
        if: ${{ (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirm deployed Pages build matches tested artifact
        if: ${{ success() && github.ref == 'refs/heads/main' && (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') }}
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ steps.predeploy.outputs.build_id }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 4 --max-time 25 "$SITE_URL/version.json?mmp_postdeploy=$GITHUB_RUN_ID" -o /tmp/mmp-live-version.json
          ACTUAL_BUILD="$(jq -r '.build // empty' /tmp/mmp-live-version.json)"
          test "$ACTUAL_BUILD" = "$EXPECTED_BUILD"
          echo "Published Pages build matches the tested artifact: $ACTUAL_BUILD"
      - name: Persist canonical mirror for legacy Pages source
        if: ${{ success() && github.ref == 'refs/heads/main' && (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') }}
        id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s version.json ] || [ ! -s index.html ]; then
            echo "Canonical artifact was not prepared; skip mirror sync safely."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add index.html quantum-lab.html admin.html market-heatmap.html assets manifest.webmanifest version.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Root Pages source already matches canonical build."
            exit 0
          fi
          BUILD_ID="$(jq -r '.build' version.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync canonical MMP site mirror $BUILD_ID [skip ci]"
          if git push origin HEAD:main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed canonical mirror $BUILD_ID to root Pages source."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not update the legacy Pages branch mirror in this run; the Actions deployment remains authoritative."
          fi


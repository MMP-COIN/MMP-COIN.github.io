name: Deploy MMP COIN AI root site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production publishing is paused
        run: |
          echo "Automatic publishing is paused during the MMP COIN AI rebuild."
          echo "The workflow must be manually dispatched after the verified new release is ready."

# Publish final health center with Radar, market-data, and QIE recovery probes from canonical source.
# Sync canonical 12-card Quantum Command modules from MMP-COIN-AI and run full Pages smoke tests.
# Sync the eight-card homepage with a fresh JS cache key before user review.
# Publish canonical MMP command-center refresh, responsive navigation and live-candle freshness fixes.
# Trigger root mirror sync after removing duplicate Quantum Command cards from the homepage hub.
# Trigger root sync for the merged eight-center visual card design in canonical MMP-COIN-AI.
# Republish canonical stylesheet cache-key update for the eight-center visual design.
# Trigger canonical www sync and full Pages smoke tests after 2026-11-11 UI and market-feed repairs.
name: Deploy MMP COIN AI root site
# Browser smoke tests use cache-busting URLs and retain full page-error stacks.
# Republish canonical server-only Radar/Hunter, Worker-backed charts, and multi-exchange failover.
# Repair HTML style order and enforce final zero-gap header geometry.
# Publish restored original 3D M-coin homepage header.
# Trigger immediate root-domain deployment of canonical UI build 930de03c48ad713ffadf7ac4122c3f05e31e69d2.
# Trigger root Pages sync for compact market catalog clarification.
# Homepage rendering fixes must be committed to canonical/www/index.html; this mirror is regenerated from that source.
# Republish canonical Market Command visibility fix from MMP-COIN-AI.
# Keep browser market scanning server-side; publish only the canonical snapshot-driven client.
# Remove duplicate Hunter polling; the unified snapshot module is the sole automatic reader.
# Keep the unified Hunter module as the only automatic snapshot poller.
# Keep native refresh aligned with the same server-side snapshots.
# Reuse one fetched Hunter snapshot for the command progress and engine panels.
# Re-sync after compact status-only quantum engine cards, accurate readiness labels, and 4+8 layout.
# Keep root-domain mirror aligned with canonical UI; verify analyzer control widths on desktop and mobile. preserve yesterday's compact M coin hero proportions and keep header in document flow and apply final-cascade top-gap correction.
# Trigger root mirror sync for the canonical Lightweight Charts 4.2.0 fix (77a30f5).
# Republish canonical JS/CSS with bumped cache keys after stale-client regression.
# Trigger root mirror sync for canonical MMP NEXUS autonomous diagnostics, merged 2026-11-12.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "root-pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout root-site mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout canonical application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MMP-COIN/MMP-COIN-AI
          ref: main
          path: canonical
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Synchronize canonical Quantum UI and brand assets
        run: |
          set -euo pipefail
          test -s canonical/www/index.html
          test -s canonical/www/quantum-lab.html
          test -s canonical/www/admin.html
          test -s canonical/www/market-heatmap.html
          test -s canonical/www/assets/mmp-coin-ai-icon.svg
          test -s canonical/www/assets/mmp-coin-mark.svg
          test -s canonical/www/assets/mmp-quantum-lab-integration.js
          test -s canonical/www/assets/mmp-quantum-terminal-v1.css
          test -s canonical/www/assets/mmp-quantum-terminal-v1.js
          test -s canonical/www/assets/mmp-chart-pro-upgrade.js
          node --check canonical/www/assets/mmp-chart-pro-upgrade.js
          test -s canonical/manifest.webmanifest
          cp canonical/www/index.html ./index.html
          cp canonical/www/quantum-lab.html ./quantum-lab.html
          cp canonical/www/admin.html ./admin.html
          cp canonical/www/market-heatmap.html ./market-heatmap.html
          mkdir -p assets
          cp -R canonical/www/assets/. assets/
          cp canonical/manifest.webmanifest ./manifest.webmanifest
          BUILD_ID="$(git -C canonical rev-parse HEAD)"
          sed -i "s/__MMP_WEB_BUILD_ID__/${BUILD_ID}/g" index.html
          # Build the Pages artifact directly from the canonical app source.
          # The generated root mirror is committed only at the end of the job,
          # after all deployment and rebase-sensitive steps have completed.
          printf '{"build":"%s","updatedAt":"%s"}\n' "$BUILD_ID" "$(date -u +%FT%TZ)" > version.json
      - name: Validate mirrored page assets exist before deployment
        run: |
          set -euo pipefail
          # The 3D visual design is now a required release asset, not an optional follow-up.
          grep -q 'mmp-real-depth-visuals.css?v=4' index.html
          grep -q 'mmp-quantum-nexus.css?v=2' index.html
          test -s assets/mmp-quantum-nexus.css
          grep -q 'MMP VISIBLE 3D PASS' assets/mmp-real-depth-visuals.css
          echo 'Required MMP 3D visual stylesheet and cache key verified.'
          test "$(grep -o 'class="quantum-engine-link"' index.html | wc -l)" -eq 12
          grep -q 'mmp-home-quantum-12-card-grid-20261112' index.html
          echo 'All 12 Quantum Command module cards are present in the Pages artifact.'
          python3 - <<'PY'
          import html.parser, pathlib, re, sys
          pages = [pathlib.Path(p) for p in ("index.html", "quantum-lab.html", "admin.html", "market-heatmap.html")]
          missing = []
          class Refs(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("src", "href") and value:
                          value=value.strip()
                          if value.startswith(("https://","http://","//","data:","mailto:","tel:","#","javascript:")): continue
                          path=value.split("?",1)[0].split("#",1)[0]
                          if path and re.search(r"\\.(?:js|css|svg|png|jpe?g|webp|ico|woff2?|webmanifest)$", path, re.I):
                              self.refs.append(path.lstrip("/"))
          for page in pages:
              parser=Refs(); parser.feed(page.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  if not pathlib.Path(ref).is_file(): missing.append(f"{page}: {ref}")
          if missing:
              print("Missing local deployment assets:")
              print("\\n".join(missing))
              sys.exit(1)
          print("All local JS/CSS/image/font/manifest references exist in the Pages artifact.")
          PY
      - name: Validate inline JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          for page in ("index.html", "quantum-lab.html", "admin.html", "market-heatmap.html"):
              source = pathlib.Path(page).read_text(encoding="utf-8")
              for number, match in enumerate(re.finditer(r"<script\b([^>]*)>(.*?)</script>", source, re.I | re.S)):
                  attrs, code = match.groups()
                  if not code.strip() or re.search(r"\bsrc\s*=", attrs, re.I):
                      continue
                  if re.search(r"\btype\s*=\s*[\"'](?:application/(?:ld\+)?json|importmap|speculationrules)[\"']", attrs, re.I):
                      continue
                  suffix = ".mjs" if re.search(r"\btype\s*=\s*[\"']module[\"']", attrs, re.I) else ".js"
                  target = pathlib.Path("/tmp") / f"mmp-{page}-{number}{suffix}"
                  target.write_text(code, encoding="utf-8")
                  checked = subprocess.run(["node", "--check", str(target)], capture_output=True, text=True)
                  if checked.returncode:
                      print(f"JavaScript syntax error in {page} inline script #{number}:")
                      print(checked.stderr)
                      sys.exit(1)
          print("Inline JavaScript syntax validated for homepage and Quantum Lab.")
          PY
      - name: Upload root site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy root site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published site and live services
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 25 -H "Cache-Control: no-cache" "$SITE_URL/?mmp_verify=$GITHUB_RUN_ID" -o /tmp/mmp-home.html
          grep -q 'MMP QUANTUM' /tmp/mmp-home.html
          grep -q 'quantum-currency-irt' /tmp/mmp-home.html
          grep -q 'class="menu-group"' /tmp/mmp-home.html
          grep -q 'fonts.googleapis.com/css2?family=Vazirmatn' /tmp/mmp-home.html
          grep -q 'market-flow?market=spot' /tmp/mmp-home.html
          grep -q 'market-orderflow' /tmp/mmp-home.html
          grep -q 'market-derivatives?symbol=' /tmp/mmp-home.html
          grep -q 'market-candles?symbol=' /tmp/mmp-home.html
          grep -q 'market-proxy?source=gate-tickers' /tmp/mmp-home.html
          ! grep -q 'fapi.binance.com' /tmp/mmp-home.html
          ! grep -q 'api.bybit.com' /tmp/mmp-home.html
          ! grep -q 'api.wallex.ir' /tmp/mmp-home.html
          ! grep -q 'mmp-command-progress' /tmp/mmp-home.html
          grep -q 'mmp-web-build' /tmp/mmp-home.html
          grep -q 'mmp-quantum-terminal-v1.js' /tmp/mmp-home.html
          grep -q 'mmp-quantum-terminal-v1.css' /tmp/mmp-home.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 -H "Cache-Control: no-cache" "$SITE_URL/assets/mmp-quantum-terminal-v1.js?v=$GITHUB_RUN_ID" -o /tmp/mmp-terminal.js
          grep -q 'mmp-terminal-hub' /tmp/mmp-terminal.js
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 -H "Cache-Control: no-cache" "$SITE_URL/assets/mmp-quantum-terminal-v1.css?v=$GITHUB_RUN_ID" -o /tmp/mmp-terminal.css
          grep -q 'mmp-hub-grid' /tmp/mmp-terminal.css
          ! grep -q 'refreshInFlight' /tmp/mmp-home.html
          grep -q 'window.__mmpRefreshInFlight' /tmp/mmp-home.html
          ! grep -q 'api.binance.com/api/v3/klines' /tmp/mmp-home.html
          ! grep -q 'stream.binance.com:9443/ws/!ticker@arr' /tmp/mmp-home.html
          ! grep -q '__MMP_WEB_BUILD_ID__' /tmp/mmp-home.html
          ! grep -q 'QUANTUM HUNTER CORE · UNIFIED ENGINE' /tmp/mmp-home.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 -H "Cache-Control: no-cache" "$SITE_URL/admin.html?mmp_verify=$GITHUB_RUN_ID" -o /tmp/mmp-admin.html
          grep -q 'مرکز مدیریت' /tmp/mmp-admin.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 -H "Cache-Control: no-cache" "$SITE_URL/market-heatmap.html?mmp_verify=$GITHUB_RUN_ID" -o /tmp/mmp-heatmap.html
          grep -q 'نقشه حرارتی بازار' /tmp/mmp-heatmap.html
          grep -q 'bybit-tickers' /tmp/mmp-heatmap.html
          grep -q 'gate-tickers' /tmp/mmp-heatmap.html
          grep -q 'bitget-tickers' /tmp/mmp-heatmap.html
          grep -q 'setTimeout(()=>controller.abort(),6500' /tmp/mmp-heatmap.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 "$SITE_URL/manifest.webmanifest" -o /tmp/mmp-manifest.json
          jq -e '.name and .icons and (.icons | length > 0)' /tmp/mmp-manifest.json >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 "$SITE_URL/assets/mmp-coin-ai-icon.svg" -o /tmp/mmp-icon.svg
          grep -q '<svg' /tmp/mmp-icon.svg
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 -H "Cache-Control: no-cache" "$SITE_URL/quantum-lab.html?mmp_verify=$GITHUB_RUN_ID" -o /tmp/mmp-lab.html
          grep -q 'MMP QUANTUM' /tmp/mmp-lab.html
          grep -q 'مرکز فرماندهی کوانتومی MMP' /tmp/mmp-lab.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 -H "Cache-Control: no-cache" "$SITE_URL/version.json?mmp_verify=$GITHUB_RUN_ID" -o /tmp/mmp-version.json
          BUILD_ID="$(jq -r '.build // empty' /tmp/mmp-version.json)"
          test -n "$BUILD_ID"
          echo "Published site build ID: $BUILD_ID"
          grep -q "$BUILD_ID" /tmp/mmp-home.html
          WORKER_STATUS="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 -o /tmp/mmp-worker-health.json -w '%{http_code}' "$WORKER_URL/health")"
          echo "Worker health HTTP: $WORKER_STATUS"
          if [ "$WORKER_STATUS" != "200" ]; then
            if grep -q "error code: 1027" /tmp/mmp-worker-health.json; then
              echo "::error::Cloudflare Worker daily request quota exhausted (Error 1027). Do not mark the live service healthy."
            else
              echo "::error::Worker health probe failed with HTTP $WORKER_STATUS."
            fi
            cat /tmp/mmp-worker-health.json || true
            exit 1
          fi
          jq -e '.worker == "online" and .ai_binding == true and .futures_engine_binding == true' /tmp/mmp-worker-health.json >/dev/null
          CANDLES_STATUS="$(curl --silent --show-error --max-time 25 -H "Origin: https://mmp-coin.github.io" -D /tmp/mmp-candles-headers -o /tmp/mmp-candles.json -w '%{http_code}' "$WORKER_URL/market-candles?symbol=BTCUSDT&interval=1h&market=spot")"
          test "$CANDLES_STATUS" = "200"
          grep -qi '^access-control-allow-origin: https://mmp-coin.github.io' /tmp/mmp-candles-headers
          jq -e '.candles | length > 0' /tmp/mmp-candles.json >/dev/null
          echo "Published site, manifest, icon, Quantum Lab, Worker health and live BTC candles verified."
      - name: Diagnose Worker transport, throttling and CORS
        env:
          WORKER_URL: https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev
          SITE_ORIGIN: https://mmp-coin.github.io
        run: |
          set -u
          echo "DNS resolution:"
          getent ahosts mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev || true
          probe() {
            label="$1"; shift
            echo "=== $label ==="
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -D /tmp/mmp-probe-headers -o /tmp/mmp-probe-body -w '%{http_code}' "$@" || true)"
            echo "HTTP_STATUS=$code"
            grep -iE '^(HTTP/|server:|cf-ray:|retry-after:|access-control-allow-origin:|access-control-allow-methods:|access-control-allow-headers:|content-type:)' /tmp/mmp-probe-headers || true
            head -c 700 /tmp/mmp-probe-body 2>/dev/null || true
            echo
          }
          probe "health no Origin" "$WORKER_URL/health"
          probe "health with site Origin" -H "Origin: $SITE_ORIGIN" "$WORKER_URL/health"
          probe "candles no Origin" -H "Accept: application/json" "$WORKER_URL/market-candles?symbol=BTCUSDT&interval=1h&market=spot"
          probe "candles with site Origin" -H "Origin: $SITE_ORIGIN" -H "Accept: application/json" "$WORKER_URL/market-candles?symbol=BTCUSDT&interval=1h&market=spot"
          probe "CORS preflight" -X OPTIONS -H "Origin: $SITE_ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: accept" "$WORKER_URL/market-candles?symbol=BTCUSDT&interval=1h&market=spot"
      - name: Browser smoke test desktop and mobile
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install --prefix /tmp/mmp-playwright --no-save playwright
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          NODE_PATH=/tmp/mmp-playwright/node_modules PLAYWRIGHT_BROWSERS_PATH=/tmp/mmp-browsers SITE_URL="$SITE_URL" node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true, channel: "chrome" });
            const failures = [];
            try {
              for (const viewport of [{name:"desktop",width:1440,height:1000},{name:"mobile-web",width:390,height:844},{name:"mobile-app",width:390,height:844}]) {
                const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
                page.on("pageerror", error => { const detail = error.stack || error.message; failures.push(viewport.name + ": " + detail); console.log(viewport.name + " PAGE ERROR: " + detail); });
                page.on("response", response => { if (response.url().includes("mmp-quantum-terminal-v1")) console.log(viewport.name + " TERMINAL ASSET RESPONSE: " + response.status() + " " + response.url()); });
                page.on("requestfailed", request => { if (request.url().includes("mmp-quantum-terminal-v1")) console.log(viewport.name + " TERMINAL ASSET REQUEST FAILED: " + request.url() + " :: " + (request.failure()?.errorText || "unknown")); if (["workers.dev","lightweight-charts","jsdelivr.net","unpkg.com"].some(host => request.url().includes(host))) console.log(viewport.name + " RESOURCE REQUEST FAILED: " + request.url() + " :: " + (request.failure()?.errorText || "unknown")); });
                page.on("response", response => { if (["workers.dev","lightweight-charts","jsdelivr.net","unpkg.com"].some(host => response.url().includes(host))) console.log(viewport.name + " RESOURCE RESPONSE: " + response.status() + " " + response.url() + " ACAO=" + (response.headers()["access-control-allow-origin"] || "MISSING")); });
                page.on("console", message => { if (message.type() === "error") console.log(viewport.name + " BROWSER CONSOLE ERROR: " + message.text()); });
                const siteOrigin = new URL(process.env.SITE_URL).origin;
                await page.route("**/*", route => { const u = new URL(route.request().url()); if (u.origin === siteOrigin) return route.continue({ headers: { ...route.request().headers(), "cache-control": "no-cache", "pragma": "no-cache" } }); return route.continue(); });
                const homeUrl = new URL(process.env.SITE_URL); homeUrl.searchParams.set("mmp_smoke", process.env.GITHUB_RUN_ID || "test");
                // The mobile pass represents the native Capacitor WebView, which always supplies this marker.
                if (viewport.name === "mobile-app") homeUrl.searchParams.set("mmp_native_version", "2.0.0");
                const response = await page.goto(homeUrl.toString(), { waitUntil: "domcontentloaded", timeout: 60000 });
                if (!response || !response.ok()) throw new Error(viewport.name + " homepage HTTP response is not successful");
                let terminalState = null;
                // GitHub Pages/CDN edges may serve the previous index for a short propagation window.
                // Retry the same cache-busted URL until the canonical terminal bundle is actually present.
                for (let attempt = 0; attempt < 7; attempt++) {
                  await page.waitForTimeout(attempt === 0 ? 7000 : 5000);
                  terminalState = await page.evaluate(() => ({
                  ready: document.body?.dataset?.mmpTerminalReady || null,
                  view: document.body?.dataset?.mmpView || null,
                  bodyClass: document.body?.className || null,
                  script: [...document.scripts].filter(s => s.src.includes("mmp-quantum-terminal-v1")).map(s => s.src),
                  hub: !!document.querySelector("#mmp-terminal-hub"),
                  hubCards: document.querySelectorAll("#mmp-terminal-hub .mmp-hub-card").length,
                  main: !!document.querySelector("#hero"),
                  sections: document.querySelectorAll("#hero > section").length
                  }));
                  if (terminalState.ready === "1" && terminalState.hubCards === 8 && terminalState.script.length > 0) break;
                  console.log(viewport.name + " stale Pages edge; retrying canonical index, attempt " + (attempt + 1));
                  if (attempt < 6) {
                    // A different query key forces a fresh Pages/CDN edge lookup; reloading the same stale URL can pin one edge response.
                    const retryUrl = new URL(homeUrl.toString());
                    retryUrl.searchParams.set("mmp_smoke_attempt", String(attempt + 1));
                    const retryResponse = await page.goto(retryUrl.toString(), { waitUntil: "domcontentloaded", timeout: 60000 });
                    if (!retryResponse || !retryResponse.ok()) throw new Error(viewport.name + " retry homepage HTTP response is not successful");
                  }
                }
                console.log(viewport.name + " TERMINAL INIT STATE: " + JSON.stringify(terminalState));
                const apiProbe = await page.evaluate(async () => {
                  const url = "https://mmp-coin-ai-analyzer.mehrdadmohammadi1988.workers.dev/market-candles?symbol=BTCUSDT&interval=1h&market=spot";
                  try {
                    const r = await fetch(url, {cache:"no-store",headers:{Accept:"application/json"}});
                    const body = await r.text();
                    let data = null; try { data = JSON.parse(body); } catch {}
                    return {ok:r.ok,status:r.status,acao:r.headers.get("access-control-allow-origin"),candles:Array.isArray(data?.candles)?data.candles.length:0,body:body.slice(0,300)};
                  } catch(e) { return {error:String(e)}; }
                });
                console.log(viewport.name + " DIRECT WORKER PROBE: " + JSON.stringify(apiProbe));
                // A successful cross-origin fetch from this page already proves browser CORS access.
                // Do not require JavaScript to read the ACAO header itself: the response header may be omitted from the exposed header list even when CORS succeeds.
                if (apiProbe.error || !apiProbe.ok || apiProbe.status !== 200 || apiProbe.candles < 1) {
                  throw new Error(viewport.name + " live Worker candle/CORS probe failed: " + JSON.stringify(apiProbe));
                }
                const title = await page.title();
                const bodyText = await page.locator("body").innerText();
                const layout = await page.evaluate(() => {
                  const header = document.querySelector("body > header.top");
                  const hero = document.querySelector("#mmp-home-hero");
                  if (!header || !hero) return null;
                  const h = header.getBoundingClientRect(), r = hero.getBoundingClientRect();
                  const cs = getComputedStyle(header), bs = getComputedStyle(document.body), hs = getComputedStyle(document.documentElement);
                  return { headerTop: Math.round(h.top), headerBottom: Math.round(h.bottom), heroTop: Math.round(r.top), heroHeight: Math.round(r.height), gap: Math.round(r.top - h.bottom), position:cs.position, top:cs.top, headerMargin:cs.marginTop, bodyMargin:bs.marginTop, bodyPadding:bs.paddingTop, htmlMargin:hs.marginTop, htmlPadding:hs.paddingTop, bodyTransform:bs.transform, scrollY:window.scrollY };
                });
                if (!layout) throw new Error(viewport.name + " missing header or first hero card");
                console.log(viewport.name + " first-screen geometry: " + JSON.stringify(layout));
                if (Math.abs(layout.headerTop) > 2) throw new Error(viewport.name + " top navigation does not start at page top");
                if (layout.gap > 12 || layout.gap < -2) throw new Error(viewport.name + " unwanted blank gap before first card: " + layout.gap + "px");
                if (layout.heroHeight > (viewport.name === "desktop" ? 170 : 180)) throw new Error(viewport.name + " first hero card is still too tall: " + layout.heroHeight + "px");
                if (!title.includes("MMP QUANTUM")) throw new Error(viewport.name + " homepage title is missing");
                const visibleQuantumCards = await page.locator("#quantum-center-entry .quantum-engine-link:visible").count();
                if (visibleQuantumCards !== 12) throw new Error(viewport.name + " homepage must visibly render all 12 Quantum Command cards; found " + visibleQuantumCards);
                if (bodyText.trim().length < 200) throw new Error(viewport.name + " homepage rendered almost no content");
                for (const id of ["refresh-all-btn","market-refresh-btn","ai-run-btn","chart-fullscreen-btn"]) {
                  if (await page.locator("#" + id).count() === 0) throw new Error(viewport.name + " missing core control: " + id);
                }
                const appMode = viewport.name === "mobile-app";
                await page.waitForFunction(() => {
                  const panel=document.getElementById("mmp-chart-pro");
                  const mode=document.getElementById("mmp-chart-candle-mode");
                  return !!panel && !!mode && panel.querySelectorAll("[data-pro-ind]").length===4;
                }, null, {timeout:8000});

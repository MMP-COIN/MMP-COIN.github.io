                  const mode = el.querySelector("#ai-market-mode");
                  const run = el.querySelector("#ai-run-btn");
                  const rect = n => { const r=n.getBoundingClientRect(); return {x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height)}; };
                  return {section:rect(el),toolbar:rect(toolbar),picker:rect(picker),mode:rect(mode),run:rect(run),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth};
                });

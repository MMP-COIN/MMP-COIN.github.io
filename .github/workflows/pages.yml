name: Controlled MMP COIN AI V4 Pages release

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: mmp-controlled-pages-release
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout canonical rebuild branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MMP-COIN/MMP-COIN-AI
          ref: rebuild/v4-new-platform
          path: canonical

      - name: Require merged PR and signed-off release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api repos/MMP-COIN/MMP-COIN-AI/pulls/47)"
          PR_MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          test "$PR_MERGED" = "true" || { echo "::error::PR #47 is not merged; deployment blocked."; exit 1; }
          test -s canonical/.release-ready.json || { echo "::error::Release evidence marker is missing; deployment blocked."; exit 1; }
          export PR_HEAD
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const marker = JSON.parse(fs.readFileSync("canonical/.release-ready.json", "utf8"));
          if (marker.pr !== 47 || marker.source_commit !== process.env.PR_HEAD ||
              marker.tests_passed !== true || marker.live_workers_verified !== true ||
              marker.pages_and_capacitor_cors_verified !== true) {
            throw new Error("Release evidence does not match merged PR #47 and all mandatory live checks.");
          }
          console.log("Release evidence matches merged PR #47:", marker.source_commit);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build root site from the tested V4 application only
        run: |
          set -euo pipefail
          test -s canonical/www/v4/index.html
          test -s canonical/www/v4/app.js
          test -s canonical/www/v4/app.css
          test -s canonical/www/v4/manifest.webmanifest
          test -s canonical/www/assets/mmp-coin-ai-icon.svg
          node --check canonical/www/v4/app.js
          rm -rf dist
          mkdir -p dist/assets
          cp canonical/www/v4/index.html dist/index.html
          cp canonical/www/v4/app.js dist/app.js
          cp canonical/www/v4/app.css dist/app.css
          cp canonical/www/v4/manifest.webmanifest dist/manifest.webmanifest
          cp canonical/www/assets/mmp-coin-ai-icon.svg dist/assets/
          BUILD_ID="$(git -C canonical rev-parse HEAD)"
          sed -i "s/__MMP_WEB_BUILD_ID__/$BUILD_ID/g" dist/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("dist/manifest.webmanifest")
          data=json.loads(p.read_text(encoding="utf-8"))
          data["start_url"]="/"
          data["scope"]="/"
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          html=Path("dist/index.html").read_text(encoding="utf-8")
          for marker in ('dir="rtl"','id="engineCore"','id="marketChart"','id="radar"','id="hunter"','id="analyzer"','app.css','app.js'):
              if marker not in html: raise SystemExit("Missing required V4 page marker: "+marker)
          for path in ("dist/app.js","dist/app.css","dist/manifest.webmanifest","dist/assets/mmp-coin-ai-icon.svg"):
              if not Path(path).is_file() or Path(path).stat().st_size == 0: raise SystemExit("Missing release asset: "+path)
          if "MMP QUANTUM | مرکز هوشمندرمزارزها" in html:
              raise SystemExit("Legacy homepage detected in release artifact")
          print("V4 root artifact and root-scoped PWA manifest verified.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy controlled V4 release
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify the actual public root deployment
        run: |
          set -euo pipefail
          URL="https://mmp-coin.github.io/"
          for attempt in $(seq 1 12); do
            STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/mmp-live.html -w '%{http_code}' "$URL")" || STATUS=000
            if [ "$STATUS" = "200" ] && grep -q 'id="engineCore"' /tmp/mmp-live.html &&
               grep -q 'id="marketChart"' /tmp/mmp-live.html &&
               ! grep -q 'MMP QUANTUM | مرکز هوشمندرمزارزها' /tmp/mmp-live.html; then
              break
            fi
            sleep 5
          done
          test "$STATUS" = "200"
          grep -q 'id="engineCore"' /tmp/mmp-live.html
          grep -q 'id="marketChart"' /tmp/mmp-live.html
          ! grep -q 'MMP QUANTUM | مرکز هوشمندرمزارزها' /tmp/mmp-live.html
          for asset in app.js app.css manifest.webmanifest assets/mmp-coin-ai-icon.svg; do
            curl --fail --silent --show-error --max-time 20 "https://mmp-coin.github.io/$asset" -o "/tmp/$(basename "$asset")"
            test -s "/tmp/$(basename "$asset")"
          done
          curl --fail --silent --show-error --max-time 20 "$URL/manifest.webmanifest" -o /tmp/mmp-live-manifest.json
          jq -e '.start_url == "/" and .scope == "/"' /tmp/mmp-live-manifest.json >/dev/null
          echo "Actual public root serves the new V4 build and all required assets."

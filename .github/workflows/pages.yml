name: Keep MMP COIN AI site in maintenance mode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-locked:
    runs-on: ubuntu-latest
    steps:
      - name: Block deployment until V4 release gates pass
        run: |
          echo "MMP COIN AI publishing is intentionally locked."
          echo "Do not publish the legacy site."
          echo "Release requires PR #47, all live checks, and controlled manual deployment."

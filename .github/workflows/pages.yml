name: Lock legacy Pages deployment during MMP controlled upgrade

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked:
    runs-on: ubuntu-latest
    steps:
      - name: Keep legacy deployment disabled
        run: |
          echo "Legacy root-site sync is locked."
          echo "Only the maintenance workflow may publish while the V4 release gate is open."
          echo "The final release workflow must be restored from .maintenance/pages-deploy-workflow.yml and remain workflow_dispatch-only."

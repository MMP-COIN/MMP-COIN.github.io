                    target.dispatchEvent(new TouchEvent("touchend",{touches:[],targetTouches:[],changedTouches:[b],bubbles:true,cancelable:true}));
                  },{from,to});
                  await swipe(100,320);
                  await page.waitForFunction(() => document.body.dataset.mmpView === "hunter", null, {timeout:3000});
                  await swipe(320,100);
                  await page.waitForFunction(() => document.body.dataset.mmpView === "command", null, {timeout:3000});
                  if (await page.locator("#native-menu-toggle").count() !== 1) throw new Error("native app must have one top menu button");
                  await page.locator("#native-menu-toggle").click();
                  const contactLink=page.locator("#native-app-menu a[href='#contact-us']");
                  if (await contactLink.count() !== 1) throw new Error("native app menu must expose one contact link");
                  await contactLink.click();
                  await page.locator("#contact-us").waitFor({state:"visible",timeout:5000});
                  if (await page.locator("#contact-us .mmp-share-app-link").count() !== 1) throw new Error("native app contact section is missing its share action");
                  if (await page.locator("#contact-us a[href^='mailto:']").count() !== 1) throw new Error("native app contact section is missing its email action");
                  if (await page.locator("#app-download").isVisible()) throw new Error("APK download section must remain website-only");
                  await openCenter("command");
                } else {

name: Deploy MMP COIN AI root site
# Publish restored original 3D M-coin homepage header.
# Homepage rendering fixes must be committed to canonical/www/index.html; this mirror is regenerated from that source.
# Re-sync after compact status-only quantum engine cards, accurate readiness labels, and 4+8 layout.
# Keep the root-domain Android WebView mirror aligned with every canonical live-quote and Quantum UI improvement.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: "root-pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      deployments: write
      id-token: write
    steps:
      - name: Checkout root-site mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout canonical application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MMP-COIN/MMP-COIN-AI
          ref: main
          path: canonical
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Synchronize canonical Quantum UI and brand assets
        run: |
          set -euo pipefail
          test -s canonical/www/index.html
          test -s canonical/www/quantum-lab.html
          test -s canonical/assets/mmp-coin-ai-icon.svg
          test -s canonical/manifest.webmanifest
          cp canonical/www/index.html ./index.html
          cp canonical/www/quantum-lab.html ./quantum-lab.html
          mkdir -p assets
          cp -R canonical/assets/. assets/
          test -s canonical/www/assets/mmp-quantum-lab-integration.js
          cp canonical/www/assets/mmp-quantum-lab-integration.js assets/mmp-quantum-lab-integration.js
          cp canonical/manifest.webmanifest ./manifest.webmanifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html quantum-lab.html assets manifest.webmanifest; then
            git add index.html quantum-lab.html assets manifest.webmanifest
            git commit -m "Sync canonical Quantum UI from core [skip ci]"
            git push
          fi
      - name: Upload root site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - name: Inspect active Pages deployments before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages/deployments?per_page=10" --jq '.[] | [.id, .sha, .environment, .created_at, .status_url] | @tsv'
      - name: Deploy root site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Hold MMP COIN AI public site in maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the public dashboard disabled until controlled V4 release
        run: |
          echo "MMP COIN AI remains in maintenance."
          echo "No site or app release is performed by this workflow."
          echo "The preserved deployment workflow is .maintenance/pages-deploy-workflow.yml."
